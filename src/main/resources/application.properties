server.port=8080
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

spring.datasource.url=jdbc:h2:file:./data/jira-analytics-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

jira.base-url=${JIRA_BASE_URL:}
jira.username=${JIRA_USERNAME:}
jira.api-token=${JIRA_API_TOKEN:}
jira.project-key=${JIRA_PROJECT_KEY:}
jira.jql=${JIRA_JQL:}   
jira.story-points-field=${JIRA_STORY_POINTS_FIELD:customfield_10016}
jira.sprint-field=${JIRA_SPRINT_FIELD:customfield_10020}
jira.sso-field=${JIRA_SSO_FIELD:}
jira.search-page-size=${JIRA_SEARCH_PAGE_SIZE:100}
jira.changelog-page-size=${JIRA_CHANGELOG_PAGE_SIZE:1000}

bitbucket.base-url=${BITBUCKET_BASE_URL:}
bitbucket.username=${BITBUCKET_USERNAME:}
bitbucket.api-token=${BITBUCKET_API_TOKEN:}
bitbucket.user-lookup-path=${BITBUCKET_USER_LOOKUP_PATH:/rest/api/1.0/users?filter=}
bitbucket.page-size=${BITBUCKET_PAGE_SIZE:100}
bitbucket.catalog-ttl-hours=${BITBUCKET_CATALOG_TTL_HOURS:24}
bitbucket.sync-concurrency=${BITBUCKET_SYNC_CONCURRENCY:5}
bitbucket.full-scan-days=${BITBUCKET_FULL_SCAN_DAYS:7}
bitbucket.participant-batch-size=${BITBUCKET_PARTICIPANT_BATCH_SIZE:25}
bitbucket.user-lookup-ttl-hours=${BITBUCKET_USER_LOOKUP_TTL_HOURS:168}
